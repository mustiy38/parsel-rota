<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parsel Rota Tanı 2</title>
<style>
body{margin:0;padding:16px;font:16px/1.4 system-ui,sans-serif;background:#EAF1EF;color:#12302A}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 12px;color:#55706A;font-size:14px}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:1px solid #C9D8D3;background:#134A40;color:#fff;margin:0 8px 8px 0}
button.alt{background:#fff;color:#12302A}
textarea{width:100%;height:60vh;font:13px/1.35 ui-monospace,Menlo,monospace;border:1px solid #C9D8D3;border-radius:10px;padding:10px;box-sizing:border-box;background:#fff;color:#12302A}
#st{font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<h1>Parsel Rota Tanı 2</h1>
<p>Bu tur yalnızca Kayseri Büyükşehir ArcGIS portalında herkese açık parsel/kadastro katmanı var mı diye bakar. TKGM'ye sorgu göndermez.</p>
<button id="run">Testi başlat</button>
<button id="copy" class="alt">Sonucu kopyala</button>
<div id="st"></div>
<textarea id="out" readonly placeholder="Sonuçlar burada görünecek"></textarea>
<script>
(function(){
const out=document.getElementById("out"),st=document.getElementById("st");
const log=s=>{out.value+=s+"\n";out.scrollTop=out.scrollHeight;};
const PORTAL="https://arcgis.kayseri.bel.tr/portal/sharing/rest";
async function getJ(name,url,ms){
  const t0=performance.now();
  try{const res=await fetch(url,{signal:AbortSignal.timeout(ms||15000),cache:"no-store"});const txt=await res.text();
    const dt=((performance.now()-t0)/1000).toFixed(1);let d=null;try{d=JSON.parse(txt);}catch(e){}
    log(`[${name}] HTTP ${res.status} · ${dt} s · ${txt.length} bayt`+(d?"":" · "+txt.slice(0,120).replace(/\s+/g," ")));return d;}
  catch(e){log(`[${name}] HATA · ${e.name}: ${e.message}`);return null;}
}
document.getElementById("run").onclick=async()=>{
  out.value="";st.textContent="Çalışıyor…";
  log("Tarih: "+new Date().toLocaleString("tr-TR"));
  const seen=new Map();
  for(const q of ["parsel","kadastro","tapu","mahalle","kent rehberi","imar","kayseri"]){
    const d=await getJ("arama: "+q,PORTAL+"/search?q="+encodeURIComponent(q)+"&num=100&f=json");
    if(d&&d.results){log(`  toplam ${d.total} sonuç`);d.results.forEach(r=>{if(!seen.has(r.id))seen.set(r.id,r);});}
  }
  log("");log("== Bulunan herkese açık öğeler ==");
  const items=[...seen.values()];
  if(!items.length)log("(hiç öğe yok)");
  items.forEach(r=>log(` - ${r.title} · ${r.type} · ${r.access} · ${r.url||""}`));
  const layers=items.filter(r=>/Feature Service|Map Service/i.test(r.type)&&r.url);
  log("");log("== Katman ayrıntıları ==");
  for(const r of layers.slice(0,15)){
    const sd=await getJ("servis "+r.title,r.url+"?f=json");
    if(!sd)continue;
    const ls=(sd.layers||[]);ls.forEach(l=>log(`   katman ${l.id}: ${l.name}`));
    const pl=ls.filter(l=>/parsel|kadastro|ada|tapu/i.test(l.name)).slice(0,4);
    for(const l of pl){
      const ld=await getJ("   alanlar "+l.name,r.url+"/"+l.id+"?f=json");
      if(ld)log("     geometri: "+ld.geometryType+" · alanlar: "+(ld.fields||[]).map(f=>f.name).join(", "));
      const qd=await getJ("   örnek "+l.name,r.url+"/"+l.id+"/query?where=1%3D1&outFields=*&resultRecordCount=1&returnGeometry=false&f=json");
      if(qd)log("     "+JSON.stringify(qd).slice(0,400));
    }
  }
  log("");log("== BİTTİ ==");st.textContent="Bitti. Sonucu kopyalayıp sohbete yapıştırın.";
};
document.getElementById("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(out.value);st.textContent="Kopyalandı.";}
  catch(e){out.select();st.textContent="Metni seçip elle kopyalayın.";}
};
})();
</script>
</body>
</html>
